name: Setup Bun
description: Install a pinned, verified bun binary and configure GitHub Packages auth

inputs:
  token:
    description: GitHub token with package read permissions (optional)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read Bun metadata
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=../../../scripts/lib/env.sh
        . "$GITHUB_WORKSPACE/scripts/lib/env.sh"
        env_file="$GITHUB_WORKSPACE/scripts/tools/bun.env"
        env_file_validate "$env_file"
        env_file_require "$env_file" BUN_TAG BUN_SHA256
        tag="$(env_file_get "$env_file" BUN_TAG)"
        {
          echo "version=${tag#bun-v}"
          echo "sha256=$(env_file_get "$env_file" BUN_SHA256)"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Bun from cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/bun
        key: bun-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha256 }}

    - name: Install Bun
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/scripts/install-bun.sh"

    - name: Write .npmrc
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -n "$TOKEN" ]; then
          cat > "$HOME/.npmrc" << EOF
        @${{ github.repository_owner }}:registry=https://npm.pkg.github.com
        //npm.pkg.github.com/:_authToken=$TOKEN
        EOF
        else
          rm -f "$HOME/.npmrc"
        fi
