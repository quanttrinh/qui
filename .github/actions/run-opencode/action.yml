name: Run OpenCode CLI
description: Run opencode with a prompt

inputs:
  model:
    description: Model in provider/model format
    required: true
  prompt_file:
    description: Path to file containing the prompt
    required: true
  variant:
    description: Model variant / reasoning effort
    required: false
    default: ''
  agent:
    description: OpenCode agent ID
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run OpenCode
      shell: bash
      env:
        TARGET_PROMPT_FILE: ${{ inputs.prompt_file }}
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_VARIANT: ${{ inputs.variant }}
        OPENCODE_AGENT: ${{ inputs.agent }}
        OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      run: |
        set -euo pipefail
        umask 077

        model="$OPENCODE_MODEL"
        if [ -n "$OPENCODE_VARIANT" ]; then
          model="${model}#${OPENCODE_VARIANT}"
        fi

        agent_args=()
        if [ -n "$OPENCODE_AGENT" ]; then
          agent_args=(--agent "$OPENCODE_AGENT")
        fi

        # The CLI stream is only useful for diagnosing failures. Keep it out of
        # the Actions log and surface the tail if the run fails.
        log_file="${RUNNER_TEMP:-/tmp}/opencode-run.log"
        set +e
        opencode run --standalone --model "$model" "${agent_args[@]}" --auto \
          < "$TARGET_PROMPT_FILE" >"$log_file" 2>&1
        status=$?
        set -e

        if [ "$status" -ne 0 ]; then
          echo "OpenCode failed with exit code $status. Log tail:" >&2
          tail -c 20000 "$log_file" >&2
          exit "$status"
        fi
