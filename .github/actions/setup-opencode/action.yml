name: Setup OpenCode CLI
description: Install a pinned, verified opencode binary and configure auth

inputs:
  api_key:
    description: API key for the provider
    required: true
  token:
    description: GitHub token for authenticated downloads
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Initialize Constants
      shell: bash
      run: |
        set -euo pipefail
        echo "TARGET_VERSION=1.18.16" >> "$GITHUB_ENV"
        echo "TARGET_SHA=286e07355df06738c1905955be15b7fbc10a7b12d931de9394a6f7597246750b" >> "$GITHUB_ENV"

    - name: Restore OpenCode from cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/opencode
        key: opencode-${{ env.TARGET_VERSION }}-${{ env.TARGET_SHA }}

    - name: Download OpenCode
      if: steps.cache.outputs.cache-hit != 'true'
      uses: ./.github/actions/download-file
      with:
        url: https://github.com/anomalyco/opencode/releases/download/v${{ env.TARGET_VERSION }}/opencode-linux-x64.tar.gz
        sha256: ${{ env.TARGET_SHA }}
        output: /tmp/opencode.tar.gz
        token: ${{ inputs.token }}

    - name: Install OpenCode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf /tmp/opencode.tar.gz -O | install -m 755 /dev/stdin /usr/local/bin/opencode
        rm /tmp/opencode.tar.gz

    - name: Verify OpenCode
      shell: bash
      run: |
        set -euo pipefail
        actual=$(opencode --version | head -1)
        actual="${actual%%+*}"
        expected="${{ env.TARGET_VERSION }}"
        case "$actual" in
          "$expected") echo "opencode $actual OK" ;;
          *)
            echo "opencode version mismatch: got '$actual', expected '$expected'" >&2
            exit 1
            ;;
        esac

    - name: Configure OpenCode auth
      shell: bash
      env:
        OPENCODE_SECRET_KEY: ${{ inputs.api_key }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/share/opencode"
        jq -n --arg key "$OPENCODE_SECRET_KEY" \
          '{"opencode-go": {type: "api", key: $key}}' \
          > "$HOME/.local/share/opencode/auth.json"

        mkdir -p "$HOME/.config/opencode"
        cat << EOF > "$HOME/.config/opencode/opencode.json"
        {
          "permission": {
            "external_directory": {
              "${HOME}/.local/share/opencode/**": "deny",
              "${HOME}/.config/opencode/**": "deny"
            }
          }
        }
        EOF

        # Disable every MCP server declared in the repo config, by name-agnostic
        # jq, so no local MCP starts on the runner.
        if [ -f opencode.json ]; then
          jq 'if has("mcp") then .mcp |= with_entries(.value.enabled = false) else . end' \
            opencode.json > opencode.json.tmp \
            && mv opencode.json.tmp opencode.json
        fi
