name: Approve Renovate checks

on:
  workflow_run:
    workflows: [CI, Pages]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  approve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-slim
    steps:
      - name: Approve pending Renovate runs
        env:
          # Prefer a dedicated app/PAT when the repository blocks GITHUB_TOKEN
          # from approving gated workflow runs.
          GH_TOKEN: ${{ secrets.RENOVATE_APPROVAL_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GH_REPO}/actions/runs?status=action_required&per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_sha] | @tsv' |
          while IFS=$'\t' read -r run_id sha; do
            pr="$(gh api "repos/${GH_REPO}/commits/${sha}/pulls" \
              --jq '[.[] | select(.user.login == "renovate[bot]" and .state == "open")][0] // empty')"
            [ -n "$pr" ] || continue

            pr_number="$(jq -r '.number' <<<"$pr")"
            files="$(gh api "repos/${GH_REPO}/pulls/${pr_number}/files?per_page=100" --jq '.[].filename')"
            if echo "$files" | grep -qvE '^(package\.json|packages/[^/]+/package\.json|bun\.lock|\.changeset/[^/]+\.md)$'; then
              echo "Skipping run ${run_id}: PR #${pr_number} changes non-dependency files"
              continue
            fi

            echo "Approving run ${run_id} for Renovate PR #${pr_number}"
            gh api -X POST "repos/${GH_REPO}/actions/runs/${run_id}/approve"
          done
