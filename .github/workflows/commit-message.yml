name: Commit Message

# pull_request rather than pull_request_target: Changesets pushes its release
# branch with GITHUB_TOKEN, and GitHub does not create pull_request_target runs
# for those pushes, so this required check never reported and blocked the
# release PR. The validator script is still checked out from the default branch,
# so no PR code is executed.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate PR title
        if: >-
          ${{ github.event.pull_request.user.login != 'renovate[bot]' &&
              !contains(github.event.pull_request.labels.*.name, 'skip-pr-title-check') }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-commit-message.sh "$PR_TITLE"

