name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "tooling/**"
      - "package.json"
      - "bun.lock"
      - ".changeset/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dependency changesets
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$(git log --format=%H --grep='^chore: version packages' -n 1)"
          if [ -z "$BASE" ]; then
            echo "::notice::No version commit found; skipping dependency changesets."
            exit 0
          fi
          bun packages/qui/tooling/scripts/generate-release-changeset.ts "$BASE" "$HEAD_SHA"

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun run release
          version-script: bun run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
