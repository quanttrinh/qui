name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            source:
              - 'packages/solid-md3/src/**'
              - 'packages/solid-md3/oxlint.config.ts'
              - 'packages/solid-md3/oxfmt.config.ts'

      - name: Setup Bun and dependencies
        uses: ./.github/actions/setup-bun
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        if: steps.filter.outputs.source == 'true'
        run: bun run fmt:check

      - name: Lint check
        if: steps.filter.outputs.source == 'true'
        run: bun run lint
