name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clear trusted checkout path
        run: rm -rf .trusted

      - name: Checkout trusted action definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false

      - name: Restore trusted action definitions
        run: |
          set -euo pipefail
          # Run trusted code, but keep the PR's pin files (data). The pin files
          # are parsed, never sourced, and validated by the install scripts.
          pin_dir="$(mktemp -d)"
          if compgen -G "scripts/tools/*.env" >/dev/null; then
            cp scripts/tools/*.env "$pin_dir"/
          fi
          rm -rf .github scripts
          cp -r .trusted/.github .github
          if [ -d .trusted/scripts ]; then
            cp -r .trusted/scripts scripts
          fi
          if compgen -G "$pin_dir/*.env" >/dev/null; then
            mkdir -p scripts/tools
            cp "$pin_dir"/*.env scripts/tools/
          fi
          rm -rf .trusted "$pin_dir"

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'packages/qui/**'
              - 'packages/server/**'
              - 'packages/unplugin/**'
              - '*.ts'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.editorconfig'
              - '.devcontainer/Containerfile'
              - 'oxfmt.config.ts'
              - 'oxlint.config.ts'
              - 'renovate.json'
            qui:
              - 'packages/qui/**'
            server:
              - 'packages/server/**'
            unplugin:
              - 'packages/unplugin/**'
            workspace:
              - '*.ts'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/**'
              - '.github/actions/**'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
              - '.devcontainer/Containerfile'
              - 'oxfmt.config.ts'
              - 'oxlint.config.ts'
              - 'renovate.json'

      - name: Setup Node
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Setup Bun
        if: steps.filter.outputs.code == 'true'
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: bun run build

      - name: Get Playwright version
        id: playwright-version
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Compute Playwright apt cache key
        id: playwright-apt-key
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: |
          echo "key=playwright-apt-${ImageOS:-unknown}-${ImageVersion:-unknown}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright apt cache
        id: playwright-apt-cache
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt-key.outputs.key }}

      - name: Configure Playwright apt cache
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        env:
          APT_CACHE_DIR: ${{ runner.temp }}/playwright-apt
        run: |
          set -euo pipefail
          mkdir -p "$APT_CACHE_DIR/partial"
          sudo chown _apt:root "$APT_CACHE_DIR/partial" || true
          sudo chmod -R a+rX "$APT_CACHE_DIR" || true
          printf 'Dir::Cache::archives "%s/";\nAPT::Keep-Downloaded-Packages "true";\n' \
            "$APT_CACHE_DIR" | sudo tee /etc/apt/apt.conf.d/99-playwright-deps-cache >/dev/null

      - name: Install Playwright system dependencies
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: bun x playwright install-deps chromium firefox webkit

      - name: Prepare Playwright apt cache
        if: (steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true') && steps.playwright-apt-cache.outputs.cache-hit != 'true'
        env:
          APT_CACHE_DIR: ${{ runner.temp }}/playwright-apt
        run: |
          set -euo pipefail
          sudo rm -f "$APT_CACHE_DIR/lock"
          sudo rm -rf "$APT_CACHE_DIR/partial"
          sudo chmod -R a+rX "$APT_CACHE_DIR" || true

      - name: Save Playwright apt cache
        if: (steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true') && steps.playwright-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt-key.outputs.key }}

      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox-webkit

      - name: Install Playwright browsers
        if: (steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true') && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun x playwright install chromium firefox webkit

      - name: Test qui
        if: steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: bun run --cwd packages/qui test

      - name: Test server
        if: steps.filter.outputs.server == 'true' || steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: bun run --cwd packages/server test

      - name: Test unplugin
        if: steps.filter.outputs.unplugin == 'true' || steps.filter.outputs.qui == 'true' || steps.filter.outputs.workspace == 'true'
        run: bun run --cwd packages/unplugin test

      - name: Format check
        if: steps.filter.outputs.code == 'true'
        run: bun run fmt:check

      - name: Lint check
        if: steps.filter.outputs.code == 'true'
        run: bun run lint
