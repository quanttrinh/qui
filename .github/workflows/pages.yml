name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/**'
      - '*.ts'
      - 'build/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-pages.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.ts'
      - 'build/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-pages.yml'

concurrency:
  # Serialize updates for one PR, but do not let another PR or a main deployment
  # cancel a queued cleanup. GitHub only keeps one pending run per group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  pr-build:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clear trusted checkout path
        run: rm -rf .trusted

      - name: Checkout trusted action definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted
          persist-credentials: false

      - name: Restore trusted action definitions
        run: |
          rm -rf .github
          cp -r .trusted/.github .github
          if [ -d .trusted/scripts ]; then
            rm -rf scripts
            cp -r .trusted/scripts scripts
          fi
          rm -rf .trusted

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build demo
        run: bun run build

      - name: Validate demo output
        run: |
          set -euo pipefail
          [ -d www ] && [ ! -L www ] || {
            echo "::error::Build output www is missing or is a symlink" >&2
            exit 1
          }
          if find www -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "::error::Build output contains symlinks or special files" >&2
            find www -mindepth 1 ! -type d ! -type f -print >&2
            exit 1
          fi
          find www -name .git -prune -exec rm -rf {} +
          find www -name .gitmodules -delete

      - name: Upload demo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-build
          path: www
          if-no-files-found: error
          retention-days: 1

  pr-deploy:
    needs: pr-build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write

    steps:
      - name: Notify deploying
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="⚡ Preview deploying...
          <!-- preview-marker -->"

          COMMENT_IDS=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" | jq -s '[.[].[] | select(.body | contains("<!-- preview-marker -->")) | .id]')

          if [ "$(jq 'length' <<< "$COMMENT_IDS")" -gt 0 ]; then
            COMMENT_ID=$(jq -r 'last' <<< "$COMMENT_IDS")
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"

            jq -r '.[0:-1][]' <<< "$COMMENT_IDS" | while read -r OLD_COMMENT_ID; do
              [ -n "$OLD_COMMENT_ID" ] || continue
              gh api -X DELETE "repos/${REPO}/issues/comments/${OLD_COMMENT_ID}" || true
            done
          else
            gh pr comment "${PR}" --body "${BODY}"
          fi

      - name: Checkout trusted action definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download demo
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-build
          path: preview-build

      - name: Verify demo
        run: |
          set -euo pipefail
          [ -d preview-build ] && [ ! -L preview-build ] || {
            echo "::error::Downloaded demo is missing or is a symlink" >&2
            exit 1
          }
          if find preview-build -mindepth 1 ! -type d ! -type f -print -quit | grep -q .; then
            echo "::error::Downloaded demo contains symlinks or special files" >&2
            find preview-build -mindepth 1 ! -type d ! -type f -print >&2
            exit 1
          fi

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages

      - name: Setup git
        uses: ./.github/actions/setup-git-bot

      - name: Deploy to gh-pages
        working-directory: gh-pages
        run: |
          set -euo pipefail
          push_with_retry() {
            local max_attempts=6
            local attempt output status
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if output=$(git push --porcelain origin HEAD:gh-pages 2>&1); then
                return 0
              else
                status=$?
              fi

              printf '%s\n' "$output" >&2
              if ! grep -Eq 'non-fast-forward|fetch first|remote contains work' <<< "$output"; then
                echo "::error::gh-pages push failed (status ${status}); not retrying" >&2
                return 1
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                break
              fi

              echo "gh-pages push was rejected; rebasing and retrying (${attempt}/${max_attempts})" >&2
              if ! git pull --rebase origin gh-pages; then
                git rebase --abort 2>/dev/null || true
                echo "::error::Failed to rebase gh-pages; aborting retry" >&2
                return 1
              fi

              sleep "$((attempt * 2 + RANDOM % 3))"
            done

            echo "::error::Unable to push gh-pages after ${max_attempts} attempts" >&2
            return 1
          }

          [ -d "pr-${{ github.event.pull_request.number }}" ] && git rm -rf "pr-${{ github.event.pull_request.number }}"
          mkdir -p "pr-${{ github.event.pull_request.number }}"
          cp -r ../preview-build/* "pr-${{ github.event.pull_request.number }}/"
          git add -- "pr-${{ github.event.pull_request.number }}"
          git diff --staged --quiet || git commit -m "Deploy preview for PR #${{ github.event.pull_request.number }}"
          push_with_retry

      - name: Update preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${PR}/"
          BODY="🚀 Preview deployed at ${URL}
          <!-- preview-marker -->"

          COMMENT_IDS=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" | jq -s '[.[].[] | select(.body | contains("<!-- preview-marker -->")) | .id]')

          if [ "$(jq 'length' <<< "$COMMENT_IDS")" -eq 0 ]; then
            echo "::error::No preview marker comment found to update" >&2
            exit 1
          fi

          COMMENT_ID=$(jq -r 'last' <<< "$COMMENT_IDS")
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"

          jq -r '.[0:-1][]' <<< "$COMMENT_IDS" | while read -r OLD_COMMENT_ID; do
            [ -n "$OLD_COMMENT_ID" ] || continue
            gh api -X DELETE "repos/${REPO}/issues/comments/${OLD_COMMENT_ID}" || true
          done

  pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull_request.closed the merge ref may already be gone.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup git
        uses: ./.github/actions/setup-git-bot

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages

      - name: Remove preview
        working-directory: gh-pages
        run: |
          set -euo pipefail
          push_with_retry() {
            local max_attempts=6
            local attempt output status
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if output=$(git push --porcelain origin HEAD:gh-pages 2>&1); then
                return 0
              else
                status=$?
              fi

              printf '%s\n' "$output" >&2
              if ! grep -Eq 'non-fast-forward|fetch first|remote contains work' <<< "$output"; then
                echo "::error::gh-pages push failed (status ${status}); not retrying" >&2
                return 1
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                break
              fi

              echo "gh-pages push was rejected; rebasing and retrying (${attempt}/${max_attempts})" >&2
              if ! git pull --rebase origin gh-pages; then
                git rebase --abort 2>/dev/null || true
                echo "::error::Failed to rebase gh-pages; aborting retry" >&2
                return 1
              fi

              sleep "$((attempt * 2 + RANDOM % 3))"
            done

            echo "::error::Unable to push gh-pages after ${max_attempts} attempts" >&2
            return 1
          }

          if [ -d "pr-${{ github.event.pull_request.number }}" ]; then
            git rm -rf "pr-${{ github.event.pull_request.number }}"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}" || true
            push_with_retry
          fi

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          package-manager-cache: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo
        run: bun run build

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: gh-pages

      - name: Setup git
        uses: ./.github/actions/setup-git-bot

      - name: Deploy to gh-pages
        working-directory: gh-pages
        run: |
          set -euo pipefail
          push_with_retry() {
            local max_attempts=6
            local attempt output status
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if output=$(git push --porcelain origin HEAD:gh-pages 2>&1); then
                return 0
              else
                status=$?
              fi

              printf '%s\n' "$output" >&2
              if ! grep -Eq 'non-fast-forward|fetch first|remote contains work' <<< "$output"; then
                echo "::error::gh-pages push failed (status ${status}); not retrying" >&2
                return 1
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                break
              fi

              echo "gh-pages push was rejected; rebasing and retrying (${attempt}/${max_attempts})" >&2
              if ! git pull --rebase origin gh-pages; then
                git rebase --abort 2>/dev/null || true
                echo "::error::Failed to rebase gh-pages; aborting retry" >&2
                return 1
              fi

              sleep "$((attempt * 2 + RANDOM % 3))"
            done

            echo "::error::Unable to push gh-pages after ${max_attempts} attempts" >&2
            return 1
          }

          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -type d ! -name .git ! -name 'pr-*' -exec rm -rf {} + 2>/dev/null || true

          cp -r ../www/* .
          git add -u -- . ':!pr-*'
          git add -- . ':!pr-*'
          git diff --staged --quiet || git commit -m "Deploy main"
          push_with_retry

  pr-deploy-pages:
    needs: pr-deploy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  pr-cleanup-pages:
    needs: pr-cleanup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  main-pages:
    needs: main
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
