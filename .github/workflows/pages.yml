name: Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - packages/demo/**
      - packages/solid-md3/src/**
      - packages/solid-md3/package.json
      - package.json
      - bun.lock
  push:
    branches: [main]
    paths:
      - packages/demo/**
      - packages/solid-md3/src/**
      - packages/solid-md3/package.json
      - package.json
      - bun.lock

permissions:
  contents: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pr-deploy:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify deploying
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          BODY="⚡ Preview deploying...
          <!-- preview-marker -->"

          COMMENT_IDS=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" | jq -s '[.[].[] | select(.body | contains("<!-- preview-marker -->")) | .id]')

          if [ "$(jq 'length' <<< "$COMMENT_IDS")" -gt 0 ]; then
            COMMENT_ID=$(jq -r 'last' <<< "$COMMENT_IDS")
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"

            jq -r '.[0:-1][]' <<< "$COMMENT_IDS" | while read -r OLD_COMMENT_ID; do
              [ -n "$OLD_COMMENT_ID" ] || continue
              gh api -X DELETE "repos/${REPO}/issues/comments/${OLD_COMMENT_ID}" || true
            done
          else
            gh pr comment "${PR}" --body "${BODY}"
          fi

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo
        run: bun run --filter ./packages/demo build --base=/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup git
        uses: ./.github/actions/setup-git

      - name: Deploy to gh-pages
        working-directory: gh-pages
        run: |
          set -e
          [ -d "pr-${{ github.event.pull_request.number }}" ] && git rm -rf "pr-${{ github.event.pull_request.number }}"
          mkdir -p "pr-${{ github.event.pull_request.number }}"
          cp -r ../packages/demo/dist/* "pr-${{ github.event.pull_request.number }}/"
          git add -- "pr-${{ github.event.pull_request.number }}"
          git diff --staged --quiet || git commit -m "Deploy preview for PR #${{ github.event.pull_request.number }}"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Update preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${PR}/"
          BODY="🚀 Preview deployed at ${URL}
          <!-- preview-marker -->"

          COMMENT_IDS=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" | jq -s '[.[].[] | select(.body | contains("<!-- preview-marker -->")) | .id]')

          if [ "$(jq 'length' <<< "$COMMENT_IDS")" -eq 0 ]; then
            echo "::error::No preview marker comment found to update" >&2
            exit 1
          fi

          COMMENT_ID=$(jq -r 'last' <<< "$COMMENT_IDS")
          gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="${BODY}"

          jq -r '.[0:-1][]' <<< "$COMMENT_IDS" | while read -r OLD_COMMENT_ID; do
            [ -n "$OLD_COMMENT_ID" ] || continue
            gh api -X DELETE "repos/${REPO}/issues/comments/${OLD_COMMENT_ID}" || true
          done

  pr-cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup git
        uses: ./.github/actions/setup-git

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove preview
        working-directory: gh-pages
        run: |
          set -e
          if [ -d "pr-${{ github.event.pull_request.number }}" ]; then
            git rm -rf "pr-${{ github.event.pull_request.number }}"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}" || true
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build demo
        run: bun run --filter ./packages/demo build --base=/${{ github.event.repository.name }}/

      - name: Checkout gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup git
        uses: ./.github/actions/setup-git

      - name: Deploy to gh-pages
        working-directory: gh-pages
        run: |
          set -e

          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -type d ! -name .git ! -name 'pr-*' -exec rm -rf {} + 2>/dev/null || true

          cp -r ../packages/demo/dist/* .
          git add -u -- . ':!pr-*'
          git add -- . ':!pr-*'
          git diff --staged --quiet || git commit -m "Deploy main"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
